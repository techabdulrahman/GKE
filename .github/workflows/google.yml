name: Build and Deploy AI SRE Agent to GKE

on:
  push:
    branches:
      - main
    paths:
      - "ai-sre-agent/**"
      - ".github/workflows/google.yml"
  workflow_dispatch:

env:
  PROJECT_ID: abdulproject-510307
  GAR_LOCATION: asia-south1
  GKE_CLUSTER: ai-k8s-cluster
  GKE_LOCATION: asia-south1
  NAMESPACE: ai-troubleshooter
  ARTIFACT_REPOSITORY: ai-k8s-repo
  IMAGE_NAME: ai-sre-agent

jobs:
  build-publish-deploy:
    name: Build, publish, and deploy agent CronJob
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2 # google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116 # google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - id: cluster-version
        name: Determine cluster-compatible kubectl version
        run: |
          VERSION="$(kubectl version -o json | python3 -c 'import json, sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"].split("-")[0])')"
          echo "kubectl_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable commit-tagged image
        env:
          IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --pull \
            --build-arg KUBECTL_VERSION="${{ steps.cluster-version.outputs.kubectl_version }}" \
            --tag "$IMAGE" ai-sre-agent
          docker push "$IMAGE"

      - name: Deploy agent CronJob
        env:
          IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed "s|__AGENT_IMAGE__|${IMAGE}|g" ai-sre-agent/k8s/agent.yaml |
            kubectl apply --namespace "$NAMESPACE" -f -
          kubectl get cronjob ai-sre-agent --namespace "$NAMESPACE" \
            -o=jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}' |
            grep -Fx "$IMAGE"
